model: "set"
optimizer: "adamw"
dataset: "clevr"
start_epoch: 0
end_epoch: 39
experiment_name: "set_50M_clevr_v2"    # v2: residual connections in the GNN + query_embed at std 1.0
from_checkpoint: false
checkpoint_file: "last.pth"
batch_size: 48          # 48 keeps the peak under 5 GiB on an 8 GiB card: above that Windows spills to shared memory and the step time triples
num_workers: 8
cache_dataset: true

model_set:
  image_shape: [3, 64, 64]
  channels: [3, 64, 192, 512]   # 3 stride 2 convolutions: 64x64 -> 8x8, so the transformer sees 64 tokens
  d_model: 512                  # must equal channels[-1]
  nhead: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dim_ff: 2048
  dropout: 0.1
  activation: "relu"
  norm_first: true        # pre-LN: a 512 wide 12 layer transformer trains much more reliably with it
  max_seq_len: 5000
  num_queries: 32         # 30 nodes + the global and the edge context queries
  d_node: 64              # the latent is 30 x 64 + 64 = 1984 floats
  d_edge: 64              # unused: this arm has no edges (kept so that one config fits both arms)
  d_global: 64
  gnn_layers: 6
  node_threshold: 0.0     # target thresholds of the gating (0 = no pruning)
  edge_threshold: 0.0     # unused: this arm has no edges
  decoder: "slot"         # 'slot' or 'crossattn'
  decoder_slot:
    res: 16
    hidden: 256             # width of the per token broadcast net: the memory is batch x slots x res^2 x hidden
    feat: 128               # channels of the composite that gets upscaled
    n_freq: 4               # frequencies of the positional encoding of the grid
    layers: 3               # depth of the per token net
    upscaler_channels: 512  # first upscaling stage: it runs on the composite only, so it is cheap capacity
    edge_slots: 0           # must be 0: this arm has no edges to render
  decoder_crossattn:
    res: 16
    d: 128
    nhead: 4
    layers: 3
    n_freq: 4
    edge_slots: 0           # must be 0: this arm has no edges to render
  apply_sigmoid: true

optimizer_adamw:
  lr: 1e-4
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: "cosine_with_warmup"
  scheduler_cosine_with_warmup:
    warmup_epochs: 5

loss:
  reconstruction: "hybrid"
  nodes: "probs"
  edges: "probs"          # unused: the model reports no edge confidences
  alpha: 1.0
  beta: 0.0               # the nodes regularizer weight: 0 because this run has no gating
  gamma: 0.0              # the edges regularizer weight: nothing to weigh here
  delay_epochs: 10
  ramp_epochs: 10
  reconstruction_hybrid:
    start_epoch: 0
    end_epoch: 10         # reach the target sooner: the v2 run only escaped the blur plateau after alpha saturated
    start_val: 0.3        # never start at pure L1: it trains towards a blur before SSIM ramps in
    end_val: 0.7
    func: "linear"
    # SSIM window: with gaussian_kernel true (default) only 'sigma' has an effect, kernel_size is ignored
    # gaussian_kernel: false
    # kernel_size: 7
